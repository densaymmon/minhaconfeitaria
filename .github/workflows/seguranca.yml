name: Verificação de segurança (semanal)
# Roda sozinha toda segunda-feira e sob demanda. Propositalmente NÃO roda em pull requests:
# o merge automático espera todos os checks do PR, e um alerta de terceiros não deve travar uma correção.
# Resultados: aba Actions (auditoria de dependências) e Security > Code scanning (CodeQL).
on:
  schedule:
    - cron: "17 9 * * 1"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  dependencias:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install --frozen-lockfile
      - name: Auditar dependências (vulnerabilidades conhecidas)
        run: |
          set +e
          bun audit 2>&1 | tee audit.txt
          status=${PIPESTATUS[0]}
          {
            echo "## Auditoria de dependências"
            if [ "$status" -eq 0 ]; then echo "Nenhuma vulnerabilidade conhecida."; else echo '```'; head -c 6000 audit.txt; echo '```'; fi
          } >> "$GITHUB_STEP_SUMMARY"
          exit "$status"
  codeql:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v4
      - uses: github/codeql-action/init@v3
        with:
          languages: javascript-typescript
      - uses: github/codeql-action/analyze@v3
