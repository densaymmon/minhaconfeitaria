name: Painel de administração (GitHub Pages)
# Publica o painel de administração da plataforma (pasta admin/) no GitHub Pages.
# Pré-requisito único: Settings → Pages → Source: "GitHub Actions".
on:
  push:
    branches: [main]
    paths:
      - "admin/**"
      - "src/components/ui/**"
      - "src/lib/**"
      - "src/integrations/supabase/types.ts"
      - "src/styles.css"
      - ".env"
      - ".github/workflows/admin-pages.yml"
  # Mesclagens automáticas (feitas pelo GitHub Actions) não disparam "push";
  # por isso o painel também é publicado ao fim de cada mesclagem automática.
  workflow_run:
    workflows: ["Auto-merge verified pull requests"]
    types: [completed]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: admin-pages
  cancel-in-progress: true
jobs:
  build:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install --frozen-lockfile
      - run: bunx vite build --config admin/vite.config.ts
      - run: cp dist-admin/index.html dist-admin/404.html
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist-admin
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
