name: Baixar fontes locais (temporário)
# Baixa as fontes do pacote Fontsource (licença OFL) para public/fonts e grava no próprio branch.
on:
  push:
    branches: [velocidade-2]
permissions:
  contents: write
jobs:
  fontes:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Baixar e gravar
        run: |
          if [ -f public/fonts/figtree.woff2 ] && [ -f public/fonts/fraunces.woff2 ]; then echo "fontes já existem"; exit 0; fi
          mkdir -p /tmp/f public/fonts
          cd /tmp/f
          npm pack @fontsource-variable/figtree@5 @fontsource-variable/fraunces@5
          for t in *.tgz; do mkdir -p "${t%.tgz}"; tar xzf "$t" -C "${t%.tgz}"; done
          ls -la */package/files | grep -i "latin-" | head -40
          cp "$(ls */package/files/figtree-latin-wght-normal.woff2 | head -1)" "$GITHUB_WORKSPACE/public/fonts/figtree.woff2"
          cp "$(ls */package/files/fraunces-latin-wght-normal.woff2 | head -1)" "$GITHUB_WORKSPACE/public/fonts/fraunces.woff2"
          cp "$(ls -d *figtree*/package)/LICENSE" "$GITHUB_WORKSPACE/public/fonts/OFL-figtree.txt" || true
          cp "$(ls -d *fraunces*/package)/LICENSE" "$GITHUB_WORKSPACE/public/fonts/OFL-fraunces.txt" || true
          cd "$GITHUB_WORKSPACE"
          ls -la public/fonts
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/fonts
          git commit -m "Fontes locais Figtree e Fraunces (latin, OFL)"
          git push
