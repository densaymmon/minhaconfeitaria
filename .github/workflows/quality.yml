name: Quality checks
on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    branches: [main]
  push:
    branches: [main, feat/controle-estoque-draft]
permissions:
  contents: read
jobs:
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      # The repository-wide lint currently reports pre-existing formatting violations
      # across unrelated files. Lint the touched application files for code rules,
      # while deferring the repository-wide Prettier cleanup.
      - run: bun install --frozen-lockfile
      - name: Lint changed application files
        run: >-
          bunx eslint src/routes/_authenticated/compras.tsx src/routes/_authenticated/producao.tsx src/routes/_authenticated/relatorios.tsx src/routes/_authenticated/painel.tsx src/routes/_authenticated/pedidos.index.tsx src/routes/_authenticated/pedidos-recorrentes.tsx 'src/routes/_authenticated/pedidos.$id.tsx' src/lib/queries.ts src/lib/calc.ts src/lib/calc.test.ts src/lib/hooks.ts src/integrations/supabase/types.ts --rule "prettier/prettier: off"
      # Os erros também viram anotações do GitHub, visíveis na API e no PR sem abrir o log.
      - name: Type-check
        run: |
          status=0
          bunx tsc --noEmit --pretty false > tsc-output.txt 2>&1 || status=$?
          cat tsc-output.txt
          sed -nE 's/^([^(]+)\(([0-9]+),([0-9]+)\): error (TS[0-9]+): (.*)$/::error file=\1,line=\2,col=\3::\4 \5/p' tsc-output.txt
          exit $status
      - run: bun run test --passWithNoTests --reporter=default --reporter=github-actions
      - run: bun run build
      - name: Build admin panel
        run: bunx vite build --config admin/vite.config.ts
  postgres-migrations:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: confeitaria_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d confeitaria_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/confeitaria_test
    steps:
      - uses: actions/checkout@v4
      - name: Prepare minimal Supabase auth compatibility layer
        run: psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f tests/db/bootstrap.sql
      - name: Apply all migrations to a disposable PostgreSQL database
        run: |
          set -euo pipefail
          for migration in drizzle/migrations/[0-9][0-9][0-9][0-9]_*.sql; do
            echo "Applying $migration"
            psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f "$migration"
          done
      - name: Smoke-test purchase, cancellation, inventory, production, and history
        run: psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f tests/db/stock-smoke.sql
      - name: Smoke-test safe ingredient deletion and purchase-history preservation
        run: psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f tests/db/ingredient-deletion-history-smoke.sql
      - name: Smoke-test recipe edits before production and lock after production starts
        run: psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f tests/db/recipe-edit-smoke.sql
      - name: Smoke-test recurring orders and duplicate confirmation protection
        run: psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f tests/db/recurring-orders-smoke.sql
      - name: Smoke-test payment installments, edits, cancellation, and balance limits
        run: psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f tests/db/payment-receipts-smoke.sql
      - name: Smoke-test order saves never overwrite registered payments
        run: psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f tests/db/salvar-pedido-recebimentos-smoke.sql
      - name: Smoke-test recipe cost formula and order cost snapshots
        run: psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f tests/db/custos-receitas-smoke.sql
      - name: Smoke-test anonymous visitors cannot read tables (RLS on every table)
        run: psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f tests/db/anonimo-sem-acesso-smoke.sql
      - name: Smoke-test multi-bakery signup gate and data isolation
        run: psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f tests/db/multiempresa-isolation-smoke.sql
      - name: Smoke-test public catalog orders (server prices, ownership, limits)
        run: psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f tests/db/catalogo-smoke.sql
      - name: Smoke-test product photos/videos, reserved addresses and short order links
        run: psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f tests/db/catalogo-midias-links-smoke.sql
      - name: Smoke-test Pix key type, bakery city and ready notice
        run: psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f tests/db/pix-aviso-smoke.sql
      - name: Smoke-test product variations (validation, server price and cost)
        run: psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f tests/db/variacoes-smoke.sql
      - name: Platform admin, approval and access smoke test
        run: psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f tests/db/plataforma-smoke.sql
      - name: Smoke-test catalog schedule, delivery areas, coupons and custom orders
        run: psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f tests/db/catalogo-extras-smoke.sql
      - name: Smoke-test push subscriptions and platform secrets
        run: psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f tests/db/push-smoke.sql
      - name: Smoke-test team members, invites and roles
        run: psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f tests/db/equipe-smoke.sql
      - name: Smoke-test daily limits, seasonal products, kits, deposit, loyalty and reviews
        run: psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f tests/db/vendas-smoke.sql
      - name: Smoke-test team history, monthly goal and label fields
        run: psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f tests/db/historico-smoke.sql
      - name: Smoke-test platform usage metrics and error monitoring
        run: psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f tests/db/plataforma-uso-smoke.sql
      - name: Create isolated database for migration-history repair test
        run: psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -c "CREATE DATABASE confeitaria_reconcile_test"
      - name: Simulate the deployed schema with an incomplete Drizzle history
        env:
          RECONCILE_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/confeitaria_reconcile_test
        run: |
          set -euo pipefail
          psql "$RECONCILE_DATABASE_URL" -v ON_ERROR_STOP=1 -f tests/db/bootstrap.sql
          for migration in drizzle/migrations/[0-9][0-9][0-9][0-9]_*.sql; do
            case "$migration" in
              drizzle/migrations/0021_*|drizzle/migrations/0022_*|drizzle/migrations/0023_*|drizzle/migrations/0024_*) break ;;
            esac
            echo "Applying pre-reconciliation schema: $migration"
            psql "$RECONCILE_DATABASE_URL" -v ON_ERROR_STOP=1 -f "$migration"
          done
          psql "$RECONCILE_DATABASE_URL" -v ON_ERROR_STOP=1 <<'SQL'
          CREATE SCHEMA drizzle;
          CREATE TABLE drizzle.__drizzle_migrations (
            id serial PRIMARY KEY,
            hash text NOT NULL,
            created_at bigint NOT NULL
          );
          INSERT INTO drizzle.__drizzle_migrations(hash, created_at) VALUES
            ('0a3873f4ae3dba406069cec5826256a3c7bd6f5a8513e2b102d31906f1565f2c', 1791649342182),
            ('c4fb68d48f9ef4ce8dc8c633eeeb33463390f79a51df789d03eceffc4428e37a', 1791651273207),
            ('e4ff100c08e4b13387bf0f3af83f79593b6023924cb5985bb7c5bcc5758d3bbe', 1791713222554),
            ('1e89567d6c3873b501aa3f264b73fdbe157845901309070e3d85b7a58c05951f', 1791914692295);
          DROP FUNCTION public.recalcular_custos_historicos();
          SQL
          psql "$RECONCILE_DATABASE_URL" -v ON_ERROR_STOP=1 -f scripts/reconcile-drizzle-history.sql
          psql "$RECONCILE_DATABASE_URL" -v ON_ERROR_STOP=1 -c "DO \$\$ BEGIN IF (SELECT count(*) FROM drizzle.__drizzle_migrations) <> 23 OR (SELECT max(created_at) FROM drizzle.__drizzle_migrations) <> 1792364400000 THEN RAISE EXCEPTION 'Drizzle history repair did not stop at migration 0020'; END IF; END \$\$;"
      - name: Apply every migration after the repaired baseline
        env:
          RECONCILE_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/confeitaria_reconcile_test
        run: |
          set -euo pipefail
          for migration in drizzle/migrations/[0-9][0-9][0-9][0-9]_*.sql; do
            case "$migration" in
              drizzle/migrations/000[0-9]_*|drizzle/migrations/001[0-9]_*|drizzle/migrations/0020_*) continue ;;
            esac
            echo "Applying pending migration after reconciliation: $migration"
            psql "$RECONCILE_DATABASE_URL" -v ON_ERROR_STOP=1 -f "$migration"
          done
          psql "$RECONCILE_DATABASE_URL" -v ON_ERROR_STOP=1 -f tests/db/recurring-orders-smoke.sql
          psql "$RECONCILE_DATABASE_URL" -v ON_ERROR_STOP=1 -f tests/db/payment-receipts-smoke.sql
          psql "$RECONCILE_DATABASE_URL" -v ON_ERROR_STOP=1 -f tests/db/receipt-divergence-smoke.sql
